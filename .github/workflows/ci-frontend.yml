name: CI Frontend

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun ci
      - run: bun run lint
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
