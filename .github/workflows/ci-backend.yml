name: CI Backend

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Create .env
        run: |
          cat > .env << 'EOF'
          POSTGRES_SERVER=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changethis
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=changethis
          SECRET_KEY=changethis
          PROJECT_NAME="Full Stack Project"
          EOF
      - name: Run tests
        run: make test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Create .env
        run: |
          cat > .env << 'EOF'
          POSTGRES_SERVER=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changethis
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=changethis
          SECRET_KEY=changethis
          PROJECT_NAME="Full Stack Project"
          EOF
      - name: Run linters
        run: make lint
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/build-push-action@v3.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: backend:${{ inputs.sha }}
