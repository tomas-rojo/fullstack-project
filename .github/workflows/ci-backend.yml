name: CI Backend

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-python
      - name: Run tests
        run: make test
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: ./.github/actions/setup-python
      - name: Run linters
        run: make lint
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/build-push-action@v3.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: backend:${{ inputs.sha }}
